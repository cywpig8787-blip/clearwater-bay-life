let mode=15,locked=Array(slots.length).fill(false),recent=slots.map(()=>[]),count=0;const grid=document.querySelector('#grid');

function visibleIndices(){if(mode===6)return [0,2,5,8,10,11];if(mode===10)return [0,1,2,4,5,7,8,10,11,12];return [...Array(15).keys()]}

const genderWeights={男性:38,女性:38,男裝女:12,女裝男:12};
function weightedPick(items,weights){const total=items.reduce((sum,x)=>sum+(weights[x]||1),0);let n=Math.random()*total;for(const x of items){n-=(weights[x]||1);if(n<0)return x}return items[items.length-1]}
function pick(i){const pool=slots[i][1],r=recent[i];let candidates=pool.filter(x=>!r.includes(x));if(!candidates.length)candidates=pool;let x;if(i===0){const recentSpecial=r.some(v=>v==='男裝女'||v==='女裝男');const w={...genderWeights};if(recentSpecial){w['男裝女']=6;w['女裝男']=6}x=weightedPick(candidates,w)}else{x=candidates[Math.floor(Math.random()*candidates.length)]}r.push(x);if(r.length>8)r.shift();return x}
function rollOne(i){if(locked[i])return;cards[i].querySelector('.value').textContent=pick(i)}
