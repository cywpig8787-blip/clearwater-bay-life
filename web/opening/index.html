<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>《人生》角色創建 v2</title><link rel="stylesheet" href="style.css?v=cyw51-r3"></head><body><div id="rotateGate" hidden>請將裝置旋轉為橫向<br><small>這份文件需要一點桌面空間。</small></div><div id="creator"><main class="paper"><nav id="tabs" aria-label="創角步驟"></nav><div class="sheet"><header><p>入學登記 · CHARACTER RECORD</p><h1 id="title"></h1></header><section id="page" aria-live="polite"></section><footer><button id="back">上一頁</button><span id="status" role="status"></span><button id="next">下一頁</button></footer></div></main><dialog id="birthdayDialog"><form method="dialog"><h2>選擇生日</h2><label>月份 <select id="birthMonth"><option value="">選擇月份</option><option value="1">1 月</option><option value="2">2 月</option><option value="3">3 月</option><option value="4">4 月</option><option value="5">5 月</option><option value="6">6 月</option><option value="7">7 月</option><option value="8">8 月</option><option value="9">9 月</option><option value="10">10 月</option><option value="11">11 月</option><option value="12">12 月</option></select></label><label>日期 <select id="birthDay" disabled><option value="">先選月份</option></select></label><div class="actions"><button type="button" id="saveBirthday">確認</button><button>取消</button></div></form></dialog><dialog id="cropDialog"><form method="dialog"><h2>裁切角色頭像</h2><div id="cropStage"><img id="cropImage" alt="待裁切頭像"><div id="cropFrame"></div></div><label>圖片縮放 <input id="zoom" type="range" min="1" max="3" value="1" step=".01"></label><div class="actions"><button id="resetCrop" type="button">重設</button><button type="button" id="confirmCrop">確認裁切</button><button>取消</button></div></form></dialog></div><script type="module" src="app.mjs?v=cyw51-r3"></script></body></html>
