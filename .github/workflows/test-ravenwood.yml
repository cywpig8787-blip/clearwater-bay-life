name: Verify Ravenwood text campus
on:
  pull_request:
    paths: ['web/opening/**', 'web/ravenwood/**', 'tests/**', '.github/workflows/test-ravenwood.yml']
  push:
    branches: [main]
    paths: ['web/opening/**', 'web/ravenwood/**', 'tests/**', '.github/workflows/test-ravenwood.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/*.test.mjs
